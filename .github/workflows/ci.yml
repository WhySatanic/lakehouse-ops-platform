name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

