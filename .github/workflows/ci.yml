name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check .
      - name: Check generated Trino access policy
        run: >-
          uv run lakeops render-trino-access-policy
          --model config/access/role-policy.json
          --output infra/trino/access-control-rules.json
          --check
      - name: Verify stable control-plane contract
        run: >-
          uv run lakeops verify-control-plane-contract
          --contract config/control-plane/contract.json
      - name: Test
        run: uv run pytest

  serving-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install integration dependencies
        run: uv sync --frozen --dev
      - name: Validate serving profiles
        run: >-
          docker compose --profile catalog --profile compute
          --profile serving config --quiet
      - name: Build catalog and compute images
        run: >-
          uv run python -m lakehouse_ops.verified_build --attempts 3
          --delay-seconds 5 -- docker compose --profile catalog --profile compute build
          hive-metastore spark-bronze spark-silver
      - name: Start core lakehouse services
        run: >-
          docker compose --profile catalog --profile compute up -d --wait
          minio metastore-db hive-metastore
      - name: Initialize storage and verify serving identity
        run: |
          docker compose run --rm minio-init
          docker compose run --rm minio-access-check
      - name: Prepare Iceberg tables with Spark
        run: |
          docker compose --profile compute run --rm landing-fixture
          docker compose --profile compute run --rm bronze-input-sync
          docker compose --profile catalog --profile compute run --rm spark-bronze
          docker compose --profile compute run --rm silver-landing-fixture
          docker compose --profile compute run --rm bronze-input-sync
          docker compose --profile catalog --profile compute run --rm spark-bronze
          docker compose --profile catalog --profile compute run --rm spark-silver
      - name: Start ClickHouse serving profile
        run: docker compose --profile serving up -d --wait clickhouse-server
      - name: Query Spark Iceberg tables through ClickHouse
        run: |
          mkdir -p artifacts
          touch artifacts/clickhouse-serving.json
          chmod 0666 artifacts/clickhouse-serving.json
          docker compose --profile serving run --rm clickhouse-iceberg-check
      - name: Verify ClickHouse serving evidence
        run: >-
          uv run python tests/integration/check_clickhouse_serving.py
          artifacts/clickhouse-serving.json
      - name: Upload serving evidence
        uses: actions/upload-artifact@v4
        with:
          name: serving-evidence
          path: artifacts/clickhouse-serving.json
          if-no-files-found: error
          overwrite: true
      - name: Show serving logs
        if: failure()
        run: >-
          docker compose --profile catalog --profile compute --profile serving logs
          minio metastore-db hive-metastore clickhouse-server
      - name: Stop serving profiles
        if: always()
        run: >-
          docker compose --profile catalog --profile compute --profile serving
          down --volumes

  ranger-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RANGER_ADMIN_PASSWORD: rangerR0cks!
      TRINO_ACCESS_CONTROL_PROPERTIES: ./infra/trino/ranger-access-control.properties
      TRINO_AUTHORIZATION_MODE: ranger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install integration dependencies
        run: uv sync --frozen --dev
      - name: Validate Ranger enforcement profiles
        run: |
          docker compose --profile security config --quiet
          docker compose --profile catalog --profile compute --profile query config --quiet
      - name: Build catalog and compute images
        run: >-
          uv run python -m lakehouse_ops.verified_build --attempts 3
          --delay-seconds 5 -- docker compose --profile catalog --profile compute build
          hive-metastore spark-bronze spark-silver
      - name: Start Ranger Admin dependencies
        run: >-
          docker compose --profile security up -d --wait --wait-timeout 420
          ranger-db ranger-solr ranger-admin
      - name: Verify Ranger Trino service definition
        run: uv run python tests/integration/check_ranger_admin.py
      - name: Start core lakehouse services
        run: >-
          docker compose --profile catalog --profile compute up -d --wait
          minio metastore-db hive-metastore
      - name: Prepare Iceberg tables
        run: |
          docker compose run --rm minio-init
          docker compose --profile catalog run --rm metastore-schema-check
          docker compose --profile compute run --rm landing-fixture
          docker compose --profile compute run --rm bronze-input-sync
          docker compose --profile catalog --profile compute run --rm spark-bronze
          docker compose --profile compute run --rm silver-landing-fixture
          docker compose --profile compute run --rm bronze-input-sync
          docker compose --profile catalog --profile compute run --rm spark-bronze
          docker compose --profile catalog --profile compute run --rm spark-silver
      - name: Synchronize centralized Ranger policy
        run: |
          mkdir -p artifacts
          uv run lakeops sync-ranger-policy > artifacts/ranger-policy-sync.json
          uv run lakeops sync-ranger-policy > artifacts/ranger-policy-resync.json
      - name: Verify idempotent Ranger synchronization
        run: >-
          uv run python tests/integration/check_ranger_policy_sync.py
          artifacts/ranger-policy-resync.json
      - name: Start Trino with Ranger enforcement
        run: >-
          docker compose --profile query up -d --wait
          trino-coordinator trino-worker trino-worker-2
      - name: Query Iceberg tables through Ranger
        run: docker compose --profile query run --rm trino-query-check
      - name: Exercise Ranger allow and deny matrix
        run: |
          touch artifacts/trino-authorization-report.json
          chmod 0666 artifacts/trino-authorization-report.json
          docker compose --profile query run --rm trino-authorization-check
      - name: Verify Ranger authorization evidence
        run: >-
          uv run python tests/integration/check_trino_authorization.py
          artifacts/trino-authorization-report.json --mode ranger
      - name: Grant approved break-glass access
        run: |
          uv run python tests/integration/create_break_glass_lease.py \
            artifacts/break-glass-active.json --state active
          uv run lakeops sync-ranger-policy \
            --break-glass-lease artifacts/break-glass-active.json \
            > artifacts/break-glass-grant.json
      - name: Verify break-glass grant
        run: >-
          uv run python tests/integration/check_break_glass_access.py
          --server http://localhost:8080 --expect allowed
          > artifacts/break-glass-allowed.json
      - name: Expire and revoke break-glass access
        run: |
          uv run python tests/integration/create_break_glass_lease.py \
            artifacts/break-glass-expired.json --state expired
          uv run lakeops sync-ranger-policy \
            --break-glass-lease artifacts/break-glass-expired.json \
            > artifacts/break-glass-revoke.json
      - name: Verify break-glass revocation
        run: >-
          uv run python tests/integration/check_break_glass_access.py
          --server http://localhost:8080 --expect denied
          > artifacts/break-glass-denied.json
      - name: Verify break-glass drill evidence
        run: >-
          uv run python tests/integration/check_break_glass_drill.py
          artifacts/break-glass-grant.json artifacts/break-glass-allowed.json
          artifacts/break-glass-revoke.json artifacts/break-glass-denied.json
      - name: Wait for Ranger audit evidence
        run: |
          for _ in $(seq 1 12); do
            docker compose exec -T ranger-solr curl -fsS \
              'http://localhost:8983/solr/ranger_audits/select?q=repo%3Alakehouse-trino&rows=100&fl=repo,enforcer,reqUser,resource,access,action,result,evtTime&wt=json' \
              > artifacts/ranger-audit.json
            if uv run python tests/integration/check_ranger_audit.py \
              artifacts/ranger-audit.json 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          uv run python tests/integration/check_ranger_audit.py artifacts/ranger-audit.json
      - name: Upload Ranger evidence
        uses: actions/upload-artifact@v4
        with:
          name: ranger-evidence
          path: |
            artifacts/ranger-policy-sync.json
            artifacts/ranger-policy-resync.json
            artifacts/trino-authorization-report.json
            artifacts/ranger-audit.json
          if-no-files-found: error
          overwrite: true
      - name: Show Ranger logs
        if: failure()
        run: >-
          docker compose --profile security --profile catalog --profile compute
          --profile query logs ranger-db ranger-solr ranger-admin trino-coordinator
      - name: Stop Ranger enforcement profiles
        if: always()
        run: >-
          docker compose --profile security --profile catalog --profile compute
          --profile query down --volumes

  lakehouse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install control-plane dependencies
        run: uv sync --frozen --dev
      - name: Validate Compose configuration
        run: |
          docker compose --profile catalog config --quiet
          docker compose --profile compute config --quiet
          docker compose --profile query config --quiet
          docker compose --profile security config --quiet
          docker compose --profile observability config --quiet
      - name: Build catalog and compute images
        run: >-
          uv run python -m lakehouse_ops.verified_build --attempts 3
          --delay-seconds 5 -- docker compose --profile catalog --profile compute build
          hive-metastore spark-bronze spark-silver
      - name: Start core services
        run: >-
          docker compose --profile catalog --profile compute up -d --wait
          minio metastore-db hive-metastore
      - name: Initialize storage
        run: docker compose run --rm minio-init
      - name: Verify MinIO service-account policy boundaries
        run: docker compose run --rm minio-access-check
      - name: Verify metastore schema
        run: docker compose --profile catalog run --rm metastore-schema-check
      - name: Land deterministic fixture
        run: docker compose --profile compute run --rm landing-fixture
      - name: Sync bronze input
        run: docker compose --profile compute run --rm bronze-input-sync
      - name: Write Iceberg bronze table
        run: docker compose --profile catalog --profile compute run --rm spark-bronze
      - name: Verify idempotent replay
        run: docker compose --profile catalog --profile compute run --rm spark-bronze
      - name: Verify catalog registration
        run: >-
          docker compose --profile catalog --profile compute run --rm
          bronze-catalog-check
      - name: Verify Iceberg objects
        run: docker compose --profile compute run --rm bronze-storage-check
      - name: Land silver acceptance cases
        run: docker compose --profile compute run --rm silver-landing-fixture
      - name: Refresh bronze input
        run: docker compose --profile compute run --rm bronze-input-sync
      - name: Add silver acceptance rows to bronze
        run: docker compose --profile catalog --profile compute run --rm spark-bronze
      - name: Build validated silver tables
        run: docker compose --profile catalog --profile compute run --rm spark-silver
      - name: Verify idempotent silver replay
        run: docker compose --profile catalog --profile compute run --rm spark-silver
      - name: Verify silver data contract
        run: >-
          docker compose --profile catalog --profile compute run --rm
          silver-contract-check
      - name: Verify silver catalog registration
        run: >-
          docker compose --profile catalog --profile compute run --rm
          silver-catalog-check
      - name: Verify silver Iceberg objects
        run: docker compose --profile compute run --rm silver-storage-check
      - name: Start Trino coordinator and workers
        env:
          TRINO_SERVER_IMAGE: trinodb/trino:482
        run: >-
          docker compose --profile query up -d --wait
          trino-coordinator trino-worker trino-worker-2
      - name: Query Iceberg tables through Trino
        env:
          TRINO_SERVER_IMAGE: trinodb/trino:482
        run: docker compose --profile query run --rm trino-query-check
      - name: Start Prometheus readiness collection
        run: >-
          docker compose --profile observability up -d
          alert-webhook alertmanager blackbox-exporter lakehouse-metrics-exporter
          prometheus grafana
      - name: Verify Prometheus core targets
        run: docker compose --profile observability run --rm prometheus-check
      - name: Verify Grafana readiness dashboard
        run: docker compose --profile observability run --rm grafana-check
      - name: Verify Grafana workload dashboard
        run: docker compose --profile observability run --rm grafana-workload-check
      - name: Verify Grafana maintenance and freshness dashboard
        run: docker compose --profile observability run --rm grafana-operational-check
      - name: Verify live platform SLOs
        env:
          EXPECTED_INGESTION_FRESHNESS_COMPLIANT: "0"
        run: |
          mkdir -p artifacts
          docker compose --profile observability run --rm platform-slo-check
      - name: Rehearse Trino upgrade and rollback
        run: >-
          uv run python tests/integration/exercise_trino_upgrade_rehearsal.py
          http://localhost:8080 artifacts/trino-upgrade-rehearsal.json
          config/trino/upgrade-rehearsal.json
      - name: Verify Trino upgrade evidence
        run: >-
          uv run python tests/integration/check_trino_upgrade_rehearsal.py
          artifacts/trino-upgrade-rehearsal.json
          config/trino/upgrade-rehearsal.json
      - name: Exercise Trino deny-by-default authorization
        run: |
          touch artifacts/trino-authorization-report.json
          chmod 0666 artifacts/trino-authorization-report.json
          docker compose --profile query run --rm trino-authorization-check
      - name: Verify Trino authorization evidence
        run: >-
          uv run python tests/integration/check_trino_authorization.py
          artifacts/trino-authorization-report.json
      - name: Capture repeatable Trino query baseline
        run: |
          mkdir -p artifacts
          uv run lakeops capture-trino-baseline \
            --server http://localhost:8080 \
            --corpus config/trino/query-corpus.json \
            > artifacts/trino-baseline.json
      - name: Verify Trino query baseline
        run: >-
          uv run python tests/integration/check_trino_baseline.py
          artifacts/trino-baseline.json
      - name: Create partition pruning fixture
        run: |
          touch artifacts/partition-pruning-fixture.json
          chmod 0666 artifacts/partition-pruning-fixture.json
          docker compose --profile catalog --profile compute run --rm spark-partition-pruning-fixture
      - name: Verify partition pruning fixture
        run: >-
          uv run python tests/integration/check_partition_pruning_fixture.py
          artifacts/partition-pruning-fixture.json
      - name: Capture Trino partition pruning evidence
        run: >-
          uv run lakeops capture-trino-partition-pruning
          --server http://localhost:8080 --target-day 2026-01-16 --repetitions 3
          > artifacts/trino-partition-pruning.json
      - name: Verify Trino partition pruning evidence
        run: >-
          uv run python tests/integration/check_trino_partition_pruning.py
          artifacts/trino-partition-pruning.json
      - name: Exercise Trino metadata cache
        run: >-
          uv run python tests/integration/exercise_trino_metadata_cache.py
          http://localhost:8080 artifacts/trino-metadata-cache.json
          infra/trino/catalog/lakehouse.properties
          infra/trino/catalog/lakehouse-cache-disabled.properties
      - name: Verify Trino metadata cache evidence
        run: >-
          uv run python tests/integration/check_trino_metadata_cache.py
          artifacts/trino-metadata-cache.json
      - name: Exercise Hive Metastore outage and recovery
        run: >-
          uv run python tests/integration/exercise_hive_metastore_recovery.py
          http://localhost:8080 artifacts/hive-metastore-recovery.json
      - name: Verify Hive Metastore recovery evidence
        run: |
          uv run python tests/integration/check_hive_metastore_recovery.py artifacts/hive-metastore-recovery.json
          docker compose --profile catalog run --rm metastore-schema-check
      - name: Exercise PostgreSQL metadata backup and restore
        run: >-
          uv run python tests/integration/exercise_metadata_db_recovery.py
          http://localhost:8080 artifacts/metadata-db-recovery.json
          artifacts/metastore-backup.dump
      - name: Verify restored metadata database evidence
        run: |
          uv run python tests/integration/check_metadata_db_recovery.py artifacts/metadata-db-recovery.json
          docker compose --profile catalog run --rm metastore-schema-check
          docker compose --profile query run --rm trino-query-check
      - name: Create sort order fixture
        run: |
          touch artifacts/sort-order-fixture.json
          chmod 0666 artifacts/sort-order-fixture.json
          docker compose --profile catalog --profile compute run --rm spark-sort-order-fixture
      - name: Verify sort order fixture
        run: >-
          uv run python tests/integration/check_sort_order_fixture.py
          artifacts/sort-order-fixture.json
      - name: Capture Trino sort order evidence
        run: >-
          uv run lakeops capture-trino-sort-order
          --server http://localhost:8080 --range-start 30000 --range-size 128
          --repetitions 3 > artifacts/trino-sort-order.json
      - name: Verify Trino sort order evidence
        run: >-
          uv run python tests/integration/check_trino_sort_order.py
          artifacts/trino-sort-order.json
      - name: Exercise Trino workload queueing
        run: >-
          uv run python tests/integration/exercise_trino_resource_groups.py
          http://localhost:8080 artifacts/trino-resource-groups-report.json
      - name: Verify Trino resource group evidence
        run: >-
          uv run python tests/integration/check_trino_resource_groups.py
          artifacts/trino-resource-groups-report.json
      - name: Exercise abrupt Trino worker recovery
        run: >-
          uv run python tests/integration/exercise_trino_worker_recovery.py
          http://localhost:8080 artifacts/trino-worker-recovery.json
      - name: Verify abrupt Trino worker recovery evidence
        run: >-
          uv run python tests/integration/check_trino_worker_recovery.py
          artifacts/trino-worker-recovery.json
      - name: Drain one Trino worker
        run: |
          touch artifacts/trino-worker-shutdown-report.json
          chmod 0666 artifacts/trino-worker-shutdown-report.json
          docker compose --profile query run --rm trino-worker-shutdown-check
      - name: Verify Trino worker shutdown evidence
        run: >-
          uv run python tests/integration/check_trino_worker_shutdown.py
          artifacts/trino-worker-shutdown-report.json
      - name: Exercise snapshot time travel and rollback
        run: |
          mkdir -p artifacts
          touch artifacts/snapshot-rollback-report.json
          chmod 0666 artifacts/snapshot-rollback-report.json
          docker compose --profile catalog --profile compute run --rm spark-snapshot-rollback-drill
      - name: Verify snapshot rollback evidence
        run: |
          uv run python tests/integration/check_snapshot_rollback.py artifacts/snapshot-rollback-report.json
          echo "RECOVERY_ABANDONED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/snapshot-rollback-report.json"))["abandoned_snapshot"]["snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Verify rollback and time travel through Trino
        run: docker compose --profile query run --rm trino-snapshot-rollback-check
      - name: Exercise schema evolution
        run: |
          touch artifacts/schema-evolution-report.json
          chmod 0666 artifacts/schema-evolution-report.json
          docker compose --profile catalog --profile compute run --rm spark-schema-evolution-drill
      - name: Verify schema evolution evidence
        run: |
          uv run python tests/integration/check_schema_evolution.py artifacts/schema-evolution-report.json
          echo "SCHEMA_INITIAL_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/schema-evolution-report.json"))["initial"]["snapshot_id"])')" >> "$GITHUB_ENV"
          echo "SCHEMA_EVOLVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/schema-evolution-report.json"))["after_add"]["snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Verify schema compatibility through Trino
        run: docker compose --profile query run --rm trino-schema-evolution-check
      - name: Exercise partition evolution
        run: |
          touch artifacts/partition-evolution-report.json
          chmod 0666 artifacts/partition-evolution-report.json
          docker compose --profile catalog --profile compute run --rm spark-partition-evolution-drill
      - name: Verify partition evolution evidence
        run: |
          uv run python tests/integration/check_partition_evolution.py artifacts/partition-evolution-report.json
          echo "PARTITION_INITIAL_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/partition-evolution-report.json"))["before_evolution"]["snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Verify mixed partition layouts through Trino
        run: docker compose --profile query run --rm trino-partition-evolution-check
      - name: Prepare interrupted-write fixture
        run: |
          touch artifacts/interrupted-write-report.json
          chmod 0666 artifacts/interrupted-write-report.json
          docker compose --profile catalog --profile compute run --rm spark-interrupted-write-fixture
      - name: Inject interrupted write and reconcile post-conditions
        run: >-
          uv run python tests/integration/exercise_interrupted_write_reconciliation.py
          artifacts/interrupted-write-report.json
      - name: Verify interrupted-write recovery evidence
        run: |
          uv run python tests/integration/check_interrupted_write_reconciliation.py artifacts/interrupted-write-report.json
          echo "INTERRUPTED_WRITE_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/interrupted-write-report.json"))["before"]["snapshot_id"])')" >> "$GITHUB_ENV"
          echo "INTERRUPTED_WRITE_FILE_COUNT=$(uv run python -c 'import json; print(len(json.load(open("artifacts/interrupted-write-report.json"))["before"]["referenced_files"]))')" >> "$GITHUB_ENV"
      - name: Verify reconciled table through Trino
        run: docker compose --profile query run --rm trino-interrupted-write-check
      - name: Collect Iceberg metadata through Trino
        run: >-
          uv run lakeops collect-iceberg-metadata
          --server http://localhost:8080
          --catalog lakehouse --schema silver --table weather_hourly
          > artifacts/iceberg-metadata-report.json
      - name: Verify Iceberg metadata report
        run: >-
          uv run python tests/integration/check_iceberg_metadata_report.py
          artifacts/iceberg-metadata-report.json
      - name: Plan Iceberg maintenance
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/iceberg-metadata-report.json
          > iceberg-maintenance-plan.json
      - name: Verify Iceberg maintenance plan
        run: >-
          uv run python tests/integration/check_iceberg_maintenance_plan.py
          iceberg-maintenance-plan.json
      - name: Create fragmented maintenance fixture
        run: >-
          docker compose --profile catalog --profile compute run --rm
          spark-maintenance-fixture
      - name: Collect maintenance fixture metadata
        run: |
          mkdir -p artifacts
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
          uv run lakeops collect-iceberg-metadata \
            --server http://localhost:8080 \
            --catalog lakehouse --schema ops --table maintenance_fixture \
            > artifacts/maintenance-metadata.json
      - name: Plan manifest rewrite
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/maintenance-metadata.json
          --min-data-files 100
          --min-manifest-count 2
          --max-manifests-per-data-file 0.5
          > artifacts/manifest-plan.json
      - name: Verify manifest rewrite plan
        run: >-
          uv run python tests/integration/check_rewrite_manifests_plan.py
          artifacts/manifest-plan.json
      - name: Select approved manifest action
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/manifest-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/manifest-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "rewrite_manifests"))')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/manifest-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/manifest-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Dry-run manifest rewrite
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/manifest-dry-run.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Execute manifest rewrite
        env:
          MAINTENANCE_APPLY: "true"
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/manifest-report.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Verify manifest rewrite reconciliation
        run: >-
          uv run python tests/integration/check_manifest_execution.py
          artifacts/manifest-dry-run.json artifacts/manifest-report.json
      - name: Refresh maintenance fixture metadata
        run: >-
          uv run lakeops collect-iceberg-metadata
          --server http://localhost:8080
          --catalog lakehouse --schema ops --table maintenance_fixture
          > artifacts/maintenance-metadata.json
      - name: Capture pre-compaction Trino benchmark
        run: >-
          uv run lakeops capture-trino-compaction
          --server http://localhost:8080 --phase before --repetitions 3
          > artifacts/trino-compaction-before.json
      - name: Plan data-file rewrite
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/maintenance-metadata.json
          > artifacts/maintenance-plan.json
      - name: Verify data-file rewrite plan
        run: >-
          uv run python tests/integration/check_rewrite_data_files_plan.py
          artifacts/maintenance-plan.json
      - name: Select approved maintenance action
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/maintenance-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/maintenance-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "rewrite_data_files"))')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/maintenance-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/maintenance-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Dry-run data-file rewrite
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/maintenance-dry-run.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Execute data-file rewrite
        env:
          MAINTENANCE_APPLY: "true"
        run: >-
          docker compose --profile catalog --profile compute run --rm
          spark-maintenance
      - name: Verify maintenance reconciliation
        run: >-
          uv run python tests/integration/check_maintenance_execution.py
          artifacts/maintenance-dry-run.json artifacts/maintenance-report.json
      - name: Capture post-compaction Trino benchmark
        run: >-
          uv run lakeops capture-trino-compaction
          --server http://localhost:8080 --phase after --repetitions 3
          > artifacts/trino-compaction-after.json
      - name: Compare Trino compaction measurements
        run: >-
          uv run lakeops compare-trino-compaction
          --before artifacts/trino-compaction-before.json
          --after artifacts/trino-compaction-after.json
          --execution artifacts/maintenance-report.json
          > artifacts/trino-compaction-experiment.json
      - name: Verify Trino compaction experiment
        run: >-
          uv run python tests/integration/check_trino_compaction_experiment.py
          artifacts/trino-compaction-experiment.json
      - name: Collect post-compaction metadata
        run: |
          mv artifacts/maintenance-report.json artifacts/data-file-report.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
          uv run lakeops collect-iceberg-metadata \
            --server http://localhost:8080 \
            --catalog lakehouse --schema ops --table maintenance_fixture \
            > artifacts/expiration-metadata.json
      - name: Plan exact snapshot expiration
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/expiration-metadata.json
          --snapshot-retention-hours 0
          --min-snapshots-to-keep 2
          --max-snapshots-to-expire 50
          > artifacts/expiration-plan.json
      - name: Verify snapshot expiration plan
        run: >-
          uv run python tests/integration/check_expiration_plan.py
          artifacts/expiration-plan.json
      - name: Select approved snapshot expiration
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/expiration-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/expiration-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "expire_snapshots"))')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/expiration-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/expiration-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Dry-run snapshot expiration
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/snapshot-expiration-dry-run.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Execute snapshot expiration
        env:
          MAINTENANCE_APPLY: "true"
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/snapshot-expiration-report.json
      - name: Verify snapshot expiration reconciliation
        run: >-
          uv run python tests/integration/check_snapshot_expiration.py
          artifacts/snapshot-expiration-dry-run.json
          artifacts/snapshot-expiration-report.json
      - name: Verify retained and expired time travel
        run: >-
          docker compose --profile catalog --profile compute run --rm
          spark-snapshot-retention-check
      - name: Collect post-expiration metadata
        run: >-
          uv run lakeops collect-iceberg-metadata
          --server http://localhost:8080
          --catalog lakehouse --schema ops --table maintenance_fixture
          > artifacts/orphan-metadata.json
      - name: Plan bounded orphan inspection
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/orphan-metadata.json
          --enable-orphan-inspection
          --orphan-retention-hours 168
          --max-orphan-files 1000
          > artifacts/orphan-plan.json
      - name: Verify orphan inspection plan
        run: >-
          uv run python tests/integration/check_orphan_plan.py
          artifacts/orphan-plan.json
      - name: Select orphan inspection
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/orphan-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/orphan-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "inspect_orphan_files"))')" >> "$GITHUB_ENV"
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Inspect orphan files without deletion
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/orphan-inspection-report.json
      - name: Verify orphan inspection evidence
        run: >-
          uv run python tests/integration/check_orphan_inspection.py
          artifacts/orphan-inspection-report.json
      - name: Prepare exact orphan removal fixture
        run: >-
          uv run python tests/integration/prepare_orphan_removal_fixture.py
          artifacts/orphan-plan.json
          artifacts/orphan-inspection-report.json
          artifacts/orphan-approved-report.json
      - name: Approve exact orphan candidate set
        run: |
          echo "MAINTENANCE_APPLY=true" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/orphan-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/orphan-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_CANDIDATE_SET_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/orphan-approved-report.json"))["candidate_set_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_CANDIDATE_REPORT_PATH=/opt/lakehouse/artifacts/orphan-approved-report.json" >> "$GITHUB_ENV"
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Remove exact approved orphan candidate set
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/orphan-removal-report.json
      - name: Verify orphan deletion and table reconciliation
        run: >-
          uv run python tests/integration/check_orphan_removal.py
          artifacts/orphan-removal-report.json
      - name: Exercise core target alert delivery
        run: |
          docker compose stop trino-coordinator
          docker compose --profile observability run --rm alert-delivery-check
      - name: Restore alerted core target
        run: >-
          docker compose --profile query up -d --wait
          trino-coordinator trino-worker trino-worker-2
      - name: Verify restored target and resolved alert
        run: |
          docker compose --profile observability run --rm prometheus-check
          EXPECTED_ALERT_STATUS=resolved docker compose --profile observability run --rm alert-delivery-check
      - name: Upload core and recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: lakehouse-evidence
          path: |
            artifacts/iceberg-metadata-report.json
            artifacts/trino-authorization-report.json
            artifacts/hive-metastore-recovery.json
            artifacts/metadata-db-recovery.json
            artifacts/trino-worker-recovery.json
            artifacts/platform-slos.json
            artifacts/trino-upgrade-rehearsal.json
          if-no-files-found: error
          overwrite: true
      - name: Show service logs
        if: failure()
        run: >-
          docker compose --profile catalog --profile compute --profile query
          --profile observability logs
          minio metastore-db hive-metastore trino-coordinator trino-worker
          trino-worker-2 prometheus blackbox-exporter lakehouse-metrics-exporter
          grafana alertmanager alert-webhook
      - name: Stop integration profile
        if: always()
        run: >-
          docker compose --profile catalog --profile compute --profile query
          --profile observability
          down --volumes

  release-readiness:
    needs: [quality, serving-integration, ranger-integration, lakehouse-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Download cross-profile evidence
        uses: actions/download-artifact@v4
        with:
          path: evidence
      - name: Verify and attest 1.0 release readiness
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run lakeops verify-release-readiness
          --contract config/release/readiness-contract.json
          --evidence-root evidence
          --source-revision "$SOURCE_REVISION"
          --output artifacts/release-readiness.json
      - name: Upload release readiness attestation
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-attestation
          path: artifacts/release-readiness.json
          if-no-files-found: error
          overwrite: true

  release-candidate:
    if: github.event_name == 'push'
    needs: [release-readiness]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false
      - name: Prove clean source checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Download verified evidence
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/evidence
      - name: Build deterministic release-candidate bundle
        run: |
          mkdir -p artifacts
          uv run lakeops build-release-candidate \
            --evidence-root "${{ runner.temp }}/evidence" \
            --attestation "${{ runner.temp }}/evidence/release-readiness-attestation/release-readiness.json" \
            --readiness-contract config/release/readiness-contract.json \
            --control-plane-contract config/control-plane/contract.json \
            --upgrade-report "${{ runner.temp }}/evidence/lakehouse-evidence/trino-upgrade-rehearsal.json" \
            --upgrade-plan config/trino/upgrade-rehearsal.json \
            --source-revision "$SOURCE_REVISION" \
            --output artifacts/lakehouse-ops-1.0.0-rc-evidence.tar.gz \
            > artifacts/release-candidate.json
      - name: Verify checkout remained clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence
          path: |
            artifacts/lakehouse-ops-1.0.0-rc-evidence.tar.gz
            artifacts/release-candidate.json
          if-no-files-found: error
          overwrite: true
