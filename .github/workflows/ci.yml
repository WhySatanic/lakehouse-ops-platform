name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  lakehouse-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install control-plane dependencies
        run: uv sync --frozen --dev
      - name: Validate Compose configuration
        run: |
          docker compose --profile catalog config --quiet
          docker compose --profile compute config --quiet
          docker compose --profile query config --quiet
      - name: Build catalog and compute images
        run: >-
          docker compose --profile catalog --profile compute build
          hive-metastore spark-bronze spark-silver
      - name: Start core services
        run: >-
          docker compose --profile catalog --profile compute up -d --wait
          minio metastore-db hive-metastore
      - name: Initialize storage
        run: docker compose run --rm minio-init
      - name: Verify metastore schema
        run: docker compose --profile catalog run --rm metastore-schema-check
      - name: Land deterministic fixture
        run: docker compose --profile compute run --rm landing-fixture
      - name: Sync bronze input
        run: docker compose --profile compute run --rm bronze-input-sync
      - name: Write Iceberg bronze table
        run: docker compose --profile catalog --profile compute run --rm spark-bronze
      - name: Verify idempotent replay
        run: docker compose --profile catalog --profile compute run --rm spark-bronze
      - name: Verify catalog registration
        run: >-
          docker compose --profile catalog --profile compute run --rm
          bronze-catalog-check
      - name: Verify Iceberg objects
        run: docker compose --profile compute run --rm bronze-storage-check
      - name: Land silver acceptance cases
        run: docker compose --profile compute run --rm silver-landing-fixture
      - name: Refresh bronze input
        run: docker compose --profile compute run --rm bronze-input-sync
      - name: Add silver acceptance rows to bronze
        run: docker compose --profile catalog --profile compute run --rm spark-bronze
      - name: Build validated silver tables
        run: docker compose --profile catalog --profile compute run --rm spark-silver
      - name: Verify idempotent silver replay
        run: docker compose --profile catalog --profile compute run --rm spark-silver
      - name: Verify silver data contract
        run: >-
          docker compose --profile catalog --profile compute run --rm
          silver-contract-check
      - name: Verify silver catalog registration
        run: >-
          docker compose --profile catalog --profile compute run --rm
          silver-catalog-check
      - name: Verify silver Iceberg objects
        run: docker compose --profile compute run --rm silver-storage-check
      - name: Start Trino coordinator and worker
        run: >-
          docker compose --profile query up -d --wait
          trino-coordinator trino-worker
      - name: Query Iceberg tables through Trino
        run: docker compose --profile query run --rm trino-query-check
      - name: Exercise snapshot time travel and rollback
        run: |
          mkdir -p artifacts
          touch artifacts/snapshot-rollback-report.json
          chmod 0666 artifacts/snapshot-rollback-report.json
          docker compose --profile catalog --profile compute run --rm spark-snapshot-rollback-drill
      - name: Verify snapshot rollback evidence
        run: |
          uv run python tests/integration/check_snapshot_rollback.py artifacts/snapshot-rollback-report.json
          echo "RECOVERY_ABANDONED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/snapshot-rollback-report.json"))["abandoned_snapshot"]["snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Verify rollback and time travel through Trino
        run: docker compose --profile query run --rm trino-snapshot-rollback-check
      - name: Collect Iceberg metadata through Trino
        run: >-
          uv run lakeops collect-iceberg-metadata
          --server http://localhost:8080
          --catalog lakehouse --schema silver --table weather_hourly
          > iceberg-metadata-report.json
      - name: Verify Iceberg metadata report
        run: >-
          uv run python tests/integration/check_iceberg_metadata_report.py
          iceberg-metadata-report.json
      - name: Plan Iceberg maintenance
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input iceberg-metadata-report.json
          > iceberg-maintenance-plan.json
      - name: Verify Iceberg maintenance plan
        run: >-
          uv run python tests/integration/check_iceberg_maintenance_plan.py
          iceberg-maintenance-plan.json
      - name: Create fragmented maintenance fixture
        run: >-
          docker compose --profile catalog --profile compute run --rm
          spark-maintenance-fixture
      - name: Collect maintenance fixture metadata
        run: |
          mkdir -p artifacts
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
          uv run lakeops collect-iceberg-metadata \
            --server http://localhost:8080 \
            --catalog lakehouse --schema ops --table maintenance_fixture \
            > artifacts/maintenance-metadata.json
      - name: Plan manifest rewrite
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/maintenance-metadata.json
          --min-data-files 100
          --min-manifest-count 2
          --max-manifests-per-data-file 0.5
          > artifacts/manifest-plan.json
      - name: Verify manifest rewrite plan
        run: >-
          uv run python tests/integration/check_rewrite_manifests_plan.py
          artifacts/manifest-plan.json
      - name: Select approved manifest action
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/manifest-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/manifest-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "rewrite_manifests"))')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/manifest-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/manifest-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Dry-run manifest rewrite
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/manifest-dry-run.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Execute manifest rewrite
        env:
          MAINTENANCE_APPLY: "true"
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/manifest-report.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Verify manifest rewrite reconciliation
        run: >-
          uv run python tests/integration/check_manifest_execution.py
          artifacts/manifest-dry-run.json artifacts/manifest-report.json
      - name: Refresh maintenance fixture metadata
        run: >-
          uv run lakeops collect-iceberg-metadata
          --server http://localhost:8080
          --catalog lakehouse --schema ops --table maintenance_fixture
          > artifacts/maintenance-metadata.json
      - name: Plan data-file rewrite
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/maintenance-metadata.json
          > artifacts/maintenance-plan.json
      - name: Verify data-file rewrite plan
        run: >-
          uv run python tests/integration/check_rewrite_data_files_plan.py
          artifacts/maintenance-plan.json
      - name: Select approved maintenance action
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/maintenance-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/maintenance-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "rewrite_data_files"))')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/maintenance-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/maintenance-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Dry-run data-file rewrite
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/maintenance-dry-run.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Execute data-file rewrite
        env:
          MAINTENANCE_APPLY: "true"
        run: >-
          docker compose --profile catalog --profile compute run --rm
          spark-maintenance
      - name: Verify maintenance reconciliation
        run: >-
          uv run python tests/integration/check_maintenance_execution.py
          artifacts/maintenance-dry-run.json artifacts/maintenance-report.json
      - name: Collect post-compaction metadata
        run: |
          mv artifacts/maintenance-report.json artifacts/data-file-report.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
          uv run lakeops collect-iceberg-metadata \
            --server http://localhost:8080 \
            --catalog lakehouse --schema ops --table maintenance_fixture \
            > artifacts/expiration-metadata.json
      - name: Plan exact snapshot expiration
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/expiration-metadata.json
          --snapshot-retention-hours 0
          --min-snapshots-to-keep 2
          --max-snapshots-to-expire 50
          > artifacts/expiration-plan.json
      - name: Verify snapshot expiration plan
        run: >-
          uv run python tests/integration/check_expiration_plan.py
          artifacts/expiration-plan.json
      - name: Select approved snapshot expiration
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/expiration-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/expiration-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "expire_snapshots"))')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/expiration-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/expiration-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
      - name: Dry-run snapshot expiration
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/snapshot-expiration-dry-run.json
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Execute snapshot expiration
        env:
          MAINTENANCE_APPLY: "true"
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/snapshot-expiration-report.json
      - name: Verify snapshot expiration reconciliation
        run: >-
          uv run python tests/integration/check_snapshot_expiration.py
          artifacts/snapshot-expiration-dry-run.json
          artifacts/snapshot-expiration-report.json
      - name: Verify retained and expired time travel
        run: >-
          docker compose --profile catalog --profile compute run --rm
          spark-snapshot-retention-check
      - name: Collect post-expiration metadata
        run: >-
          uv run lakeops collect-iceberg-metadata
          --server http://localhost:8080
          --catalog lakehouse --schema ops --table maintenance_fixture
          > artifacts/orphan-metadata.json
      - name: Plan bounded orphan inspection
        run: >-
          uv run lakeops plan-iceberg-maintenance
          --input artifacts/orphan-metadata.json
          --enable-orphan-inspection
          --orphan-retention-hours 168
          --max-orphan-files 1000
          > artifacts/orphan-plan.json
      - name: Verify orphan inspection plan
        run: >-
          uv run python tests/integration/check_orphan_plan.py
          artifacts/orphan-plan.json
      - name: Select orphan inspection
        run: |
          echo "MAINTENANCE_PLAN_PATH=/opt/lakehouse/artifacts/orphan-plan.json" >> "$GITHUB_ENV"
          echo "MAINTENANCE_ACTION_ID=$(uv run python -c 'import json; p=json.load(open("artifacts/orphan-plan.json")); print(next(a["action_id"] for a in p["actions"] if a["action_type"] == "inspect_orphan_files"))')" >> "$GITHUB_ENV"
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Inspect orphan files without deletion
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/orphan-inspection-report.json
      - name: Verify orphan inspection evidence
        run: >-
          uv run python tests/integration/check_orphan_inspection.py
          artifacts/orphan-inspection-report.json
      - name: Prepare exact orphan removal fixture
        run: >-
          uv run python tests/integration/prepare_orphan_removal_fixture.py
          artifacts/orphan-plan.json
          artifacts/orphan-inspection-report.json
          artifacts/orphan-approved-report.json
      - name: Approve exact orphan candidate set
        run: |
          echo "MAINTENANCE_APPLY=true" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_PLAN_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/orphan-plan.json"))["plan_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_SNAPSHOT_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/orphan-plan.json"))["source"]["current_snapshot_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_APPROVED_CANDIDATE_SET_ID=$(uv run python -c 'import json; print(json.load(open("artifacts/orphan-approved-report.json"))["candidate_set_id"])')" >> "$GITHUB_ENV"
          echo "MAINTENANCE_CANDIDATE_REPORT_PATH=/opt/lakehouse/artifacts/orphan-approved-report.json" >> "$GITHUB_ENV"
          touch artifacts/maintenance-report.json
          chmod 0666 artifacts/maintenance-report.json
      - name: Remove exact approved orphan candidate set
        run: |
          docker compose --profile catalog --profile compute run --rm spark-maintenance
          mv artifacts/maintenance-report.json artifacts/orphan-removal-report.json
      - name: Verify orphan deletion and table reconciliation
        run: >-
          uv run python tests/integration/check_orphan_removal.py
          artifacts/orphan-removal-report.json
      - name: Show service logs
        if: failure()
        run: >-
          docker compose --profile catalog --profile compute --profile query logs
          minio metastore-db hive-metastore trino-coordinator trino-worker
      - name: Stop integration profile
        if: always()
        run: >-
          docker compose --profile catalog --profile compute --profile query
          down --volumes
