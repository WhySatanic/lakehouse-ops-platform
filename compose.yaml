  bronze-catalog-check:
    image: postgres:17.10-alpine3.23
    profiles: ["compute"]
    depends_on:
      spark-bronze:
        condition: service_completed_successfully
    environment:
      PGHOST: metastore-db
      PGDATABASE: ${HMS_POSTGRES_DB:-metastore}
      PGUSER: ${HMS_POSTGRES_USER:-hive}
      PGPASSWORD: ${HMS_POSTGRES_PASSWORD:-hive-development-only}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        table_count="$$(psql --tuples-only --no-align --set ON_ERROR_STOP=1 --command \
          "SELECT count(*) FROM \"TBLS\" t JOIN \"DBS\" d ON d.\"DB_ID\" = t.\"DB_ID\" JOIN \"SDS\" s ON s.\"SD_ID\" = t.\"SD_ID\" WHERE lower(d.\"NAME\") = 'bronze' AND lower(t.\"TBL_NAME\") = 'weather_hourly' AND s.\"LOCATION\" LIKE 's3a://$${LAKEHOUSE_BUCKET:-lakehouse}/warehouse/%'")"
        test "$$table_count" = "1"
        printf '{"status":"ready","catalog_tables":%s}\n' "$$table_count"
    restart: "no"

  bronze-storage-check:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["compute"]
    depends_on:
      spark-bronze:
        condition: service_completed_successfully
    environment:
      MINIO_TRINO_USER: ${MINIO_TRINO_USER:-lakeops-trino}
      MINIO_TRINO_PASSWORD: ${MINIO_TRINO_PASSWORD:-trino-development-only}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_TRINO_USER}" "$${MINIO_TRINO_PASSWORD}"
        metadata_files="$$(mc find "local/$${LAKEHOUSE_BUCKET}/warehouse" --name '*.metadata.json' | wc -l | tr -d ' ')"
        data_files="$$(mc find "local/$${LAKEHOUSE_BUCKET}/warehouse" --name '*.parquet' | wc -l | tr -d ' ')"
        test "$$metadata_files" -gt 0
        test "$$data_files" -gt 0
        printf '{"status":"ready","metadata_files":%s,"data_files":%s}\n' \
          "$$metadata_files" "$$data_files"
    restart: "no"

