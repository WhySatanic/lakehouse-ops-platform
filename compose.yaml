name: lakehouse-ops

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakeops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakeops-development-only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakeops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakeops-development-only}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      MINIO_INGEST_USER: ${MINIO_INGEST_USER:-lakeops-ingest}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD:-ingest-development-only}
      MINIO_SPARK_USER: ${MINIO_SPARK_USER:-lakeops-spark}
      MINIO_SPARK_PASSWORD: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      MINIO_TRINO_USER: ${MINIO_TRINO_USER:-lakeops-trino}
      MINIO_TRINO_PASSWORD: ${MINIO_TRINO_PASSWORD:-trino-development-only}
      MINIO_HMS_USER: ${MINIO_HMS_USER:-lakeops-hms}
      MINIO_HMS_PASSWORD: ${MINIO_HMS_PASSWORD:-hms-development-only}
    volumes:
      - ./config/s3:/policies:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${LAKEHOUSE_BUCKET}" &&
        mc anonymous set none "local/$${LAKEHOUSE_BUCKET}" &&
        for identity in ingest spark trino hms; do
          upper="$$(printf '%s' "$$identity" | tr '[:lower:]' '[:upper:]')";
          eval user="\$${MINIO_$${upper}_USER}";
          eval password="\$${MINIO_$${upper}_PASSWORD}";
          while IFS= read -r line; do
            printf '%s\n' "$${line//__BUCKET__/$${LAKEHOUSE_BUCKET}}";
          done < "/policies/$${identity}-policy.json" > "/tmp/$${identity}-policy.json";
          mc admin policy create local "lakehouse-$${identity}" "/tmp/$${identity}-policy.json";
          mc admin user add local "$$user" "$$password";
          mc admin policy attach local "lakehouse-$${identity}" --user "$$user";
        done
    restart: "no"

  minio-access-check:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      MINIO_INGEST_USER: ${MINIO_INGEST_USER:-lakeops-ingest}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD:-ingest-development-only}
      MINIO_SPARK_USER: ${MINIO_SPARK_USER:-lakeops-spark}
      MINIO_SPARK_PASSWORD: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      MINIO_TRINO_USER: ${MINIO_TRINO_USER:-lakeops-trino}
      MINIO_TRINO_PASSWORD: ${MINIO_TRINO_PASSWORD:-trino-development-only}
      MINIO_HMS_USER: ${MINIO_HMS_USER:-lakeops-hms}
      MINIO_HMS_PASSWORD: ${MINIO_HMS_PASSWORD:-hms-development-only}
    volumes:
      - ./tests/fixtures/open_meteo_landing.json:/fixtures/probe.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set ingest http://minio:9000 "$${MINIO_INGEST_USER}" "$${MINIO_INGEST_PASSWORD}"
        mc alias set spark http://minio:9000 "$${MINIO_SPARK_USER}" "$${MINIO_SPARK_PASSWORD}"
        mc alias set trino http://minio:9000 "$${MINIO_TRINO_USER}" "$${MINIO_TRINO_PASSWORD}"
        mc alias set hms http://minio:9000 "$${MINIO_HMS_USER}" "$${MINIO_HMS_PASSWORD}"
        mc cp /fixtures/probe.json "ingest/$${LAKEHOUSE_BUCKET}/landing/_access/ingest.json"
        mc stat "spark/$${LAKEHOUSE_BUCKET}/landing/_access/ingest.json" >/dev/null
        mc cp /fixtures/probe.json "spark/$${LAKEHOUSE_BUCKET}/warehouse/_access/spark.json"
        mc stat "trino/$${LAKEHOUSE_BUCKET}/warehouse/_access/spark.json" >/dev/null
        mc cp /fixtures/probe.json "hms/$${LAKEHOUSE_BUCKET}/warehouse/_access/hms.json"
        mc rm "hms/$${LAKEHOUSE_BUCKET}/warehouse/_access/hms.json"
        if mc cp /fixtures/probe.json "ingest/$${LAKEHOUSE_BUCKET}/warehouse/_access/denied.json" >/dev/null 2>&1; then exit 1; fi
        if mc cp /fixtures/probe.json "spark/$${LAKEHOUSE_BUCKET}/landing/_access/denied.json" >/dev/null 2>&1; then exit 1; fi
        if mc cp /fixtures/probe.json "trino/$${LAKEHOUSE_BUCKET}/warehouse/_access/denied.json" >/dev/null 2>&1; then exit 1; fi
        if mc stat "trino/$${LAKEHOUSE_BUCKET}/landing/_access/ingest.json" >/dev/null 2>&1; then exit 1; fi
        if mc cp /fixtures/probe.json "hms/$${LAKEHOUSE_BUCKET}/landing/_access/denied.json" >/dev/null 2>&1; then exit 1; fi
        printf '%s\n' '{"schema_version":"1.0","status":"ready","ingest":"landing-read-write","spark":"landing-read-warehouse-write","trino":"warehouse-read-only","hms":"warehouse-path-manage"}'
    restart: "no"

  metastore-db:
    image: postgres:17.10-alpine3.23
    profiles: ["catalog", "compute", "query"]
    environment:
      POSTGRES_DB: ${HMS_POSTGRES_DB:-metastore}
      POSTGRES_USER: ${HMS_POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${HMS_POSTGRES_PASSWORD:-hive-development-only}
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  hive-metastore:
    image: lakehouse-ops/hive-metastore:4.0.0-s3a-pgjdbc-42.7.13
    build:
      context: .
      dockerfile: infra/hive-metastore/Dockerfile
    profiles: ["catalog", "compute", "query"]
    depends_on:
      metastore-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      AWS_ACCESS_KEY_ID: ${MINIO_HMS_USER:-lakeops-hms}
      AWS_SECRET_ACCESS_KEY: ${MINIO_HMS_PASSWORD:-hms-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/${HMS_POSTGRES_DB:-metastore}
        -Djavax.jdo.option.ConnectionUserName=${HMS_POSTGRES_USER:-hive}
        -Djavax.jdo.option.ConnectionPassword=${HMS_POSTGRES_PASSWORD:-hive-development-only}
        -Dmetastore.try.direct.sql.ddl=false
        -Dmetastore.warehouse.dir=s3a://${LAKEHOUSE_BUCKET:-lakehouse}/warehouse
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    volumes:
      - warehouse-data:/opt/hive/data/warehouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9083'",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  metastore-schema-check:
    image: postgres:17.10-alpine3.23
    profiles: ["catalog"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      PGHOST: metastore-db
      PGDATABASE: ${HMS_POSTGRES_DB:-metastore}
      PGUSER: ${HMS_POSTGRES_USER:-hive}
      PGPASSWORD: ${HMS_POSTGRES_PASSWORD:-hive-development-only}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        table_count="$$(psql --tuples-only --no-align --set ON_ERROR_STOP=1 --command \
          "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('VERSION', 'DBS', 'TBLS', 'SDS', 'SERDES')")"
        test "$$table_count" = "5"
        schema_version="$$(psql --tuples-only --no-align --set ON_ERROR_STOP=1 --command \
          'SELECT "SCHEMA_VERSION" FROM "VERSION" LIMIT 1')"
        test -n "$$schema_version"
        printf '{"status":"ready","schema_version":"%s","required_tables":%s}\n' \
          "$$schema_version" "$$table_count"
    restart: "no"

  ranger-db:
    image: apache/ranger-db:2.9.0
    profiles: ["security"]
    hostname: ranger-db.rangernw
    environment:
      POSTGRES_PASSWORD: ${RANGER_DB_ROOT_PASSWORD:-rangerR0cks!}
      RANGER_DB_USER: ${RANGER_DB_USER:-rangeradmin}
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD:-rangerR0cks!}
    volumes:
      - ranger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "su -c 'pg_isready -q' postgres"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ranger-solr:
    image: apache/ranger-solr:2.9.0
    profiles: ["security"]
    hostname: ranger-solr.rangernw
    command:
      - solr-precreate
      - ranger_audits
      - /opt/solr/server/solr/configsets/ranger_audits/
    volumes:
      - ranger-solr-data:/var/solr
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8983/solr/ranger_audits/admin/ping >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ranger-admin:
    image: apache/ranger:2.9.0
    profiles: ["security"]
    hostname: ranger-admin.rangernw
    entrypoint: ["/bin/bash", "/home/ranger/bootstrap/ranger-admin-entrypoint.sh"]
    depends_on:
      ranger-db:
        condition: service_healthy
      ranger-solr:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${RANGER_DB_ROOT_PASSWORD:-rangerR0cks!}
      RANGER_DB_USER: ${RANGER_DB_USER:-rangeradmin}
      RANGER_DB_PASSWORD: ${RANGER_DB_PASSWORD:-rangerR0cks!}
    ports:
      - "${RANGER_ADMIN_PORT:-6080}:6080"
    volumes:
      - ./infra/ranger/ranger-admin-entrypoint.sh:/home/ranger/bootstrap/ranger-admin-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6080/login.jsp >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 30s
    restart: unless-stopped

  landing-fixture:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["compute"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_INGEST_USER: ${MINIO_INGEST_USER:-lakeops-ingest}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD:-ingest-development-only}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    volumes:
      - ./tests/fixtures/open_meteo_landing.json:/fixtures/open_meteo_landing.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_INGEST_USER}" "$${MINIO_INGEST_PASSWORD}"
        mc cp /fixtures/open_meteo_landing.json \
          "local/$${LAKEHOUSE_BUCKET}/landing/source=open_meteo/ingest_date=2026-08-06/location=moscow/d11e9a60acb9c55a4dee581bdccb9ecf992328f50db03042d8df4ba1301defa6.json"
    restart: "no"

  silver-landing-fixture:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["compute"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_INGEST_USER: ${MINIO_INGEST_USER:-lakeops-ingest}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD:-ingest-development-only}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    volumes:
      - ./tests/fixtures/open_meteo_silver_cases.json:/fixtures/open_meteo_silver_cases.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_INGEST_USER}" "$${MINIO_INGEST_PASSWORD}"
        mc cp /fixtures/open_meteo_silver_cases.json \
          "local/$${LAKEHOUSE_BUCKET}/landing/source=open_meteo/ingest_date=2026-08-06/location=moscow/0500bb2b50ec417801db2bce49ee65ed3f835ad6271792b3a3a083ecc44c572b.json"
    restart: "no"

  bronze-input-sync:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["compute"]
    depends_on:
      landing-fixture:
        condition: service_completed_successfully
    environment:
      MINIO_SPARK_USER: ${MINIO_SPARK_USER:-lakeops-spark}
      MINIO_SPARK_PASSWORD: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    volumes:
      - bronze-input:/input
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_SPARK_USER}" "$${MINIO_SPARK_PASSWORD}"
        mc mirror --overwrite "local/$${LAKEHOUSE_BUCKET}/landing" /input
        object_count="$$(mc find "local/$${LAKEHOUSE_BUCKET}/landing" --name '*.json' | wc -l | tr -d ' ')"
        test "$$object_count" -gt 0
        printf '{"status":"ready","landing_objects":%s}\n' "$$object_count"
    restart: "no"

  spark-bronze:
    image: lakehouse-ops/spark-iceberg:3.5.9-1.11.0
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    profiles: ["compute"]
    depends_on:
      bronze-input-sync:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      LAKEOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER:-lakeops-spark}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      BRONZE_INPUT_ROOT: /opt/lakehouse/input
      SPARK_MASTER: local[2]
    volumes:
      - ./jobs/spark:/opt/lakehouse/jobs:ro
      - bronze-input:/opt/lakehouse/input:ro
    command: ["/opt/spark/bin/spark-submit", "/opt/lakehouse/jobs/bronze_weather.py"]
    restart: "no"

  spark-silver:
    image: lakehouse-ops/spark-iceberg:3.5.9-1.11.0
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    profiles: ["compute"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      LAKEOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER:-lakeops-spark}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_MASTER: local[2]
    volumes:
      - ./jobs/spark:/opt/lakehouse/jobs:ro
    command: ["/opt/spark/bin/spark-submit", "/opt/lakehouse/jobs/silver_weather.py"]
    restart: "no"

  spark-maintenance-fixture:
    image: lakehouse-ops/spark-iceberg:3.5.9-1.11.0
    profiles: ["compute"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      LAKEOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER:-lakeops-spark}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_MASTER: local[2]
      PYTHONPATH: /opt/lakehouse/jobs
    volumes:
      - ./jobs/spark:/opt/lakehouse/jobs:ro
      - ./tests/integration/create_maintenance_fixture.py:/opt/lakehouse/tests/create_maintenance_fixture.py:ro
    command:
      [
        "/opt/spark/bin/spark-submit",
        "/opt/lakehouse/tests/create_maintenance_fixture.py",
      ]
    restart: "no"

  spark-maintenance:
    image: lakehouse-ops/spark-iceberg:3.5.9-1.11.0
    profiles: ["compute"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      LAKEOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER:-lakeops-spark}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_MASTER: local[2]
      PYTHONPATH: /opt/lakehouse/src:/opt/lakehouse/jobs
      MAINTENANCE_PLAN_PATH: ${MAINTENANCE_PLAN_PATH:-/opt/lakehouse/artifacts/maintenance-plan.json}
      MAINTENANCE_REPORT_PATH: /opt/lakehouse/artifacts/maintenance-report.json
      MAINTENANCE_ACTION_ID: ${MAINTENANCE_ACTION_ID:-unset}
      MAINTENANCE_APPLY: ${MAINTENANCE_APPLY:-false}
      MAINTENANCE_APPROVED_PLAN_ID: ${MAINTENANCE_APPROVED_PLAN_ID:-}
      MAINTENANCE_APPROVED_SNAPSHOT_ID: ${MAINTENANCE_APPROVED_SNAPSHOT_ID:-}
      MAINTENANCE_APPROVED_CANDIDATE_SET_ID: ${MAINTENANCE_APPROVED_CANDIDATE_SET_ID:-}
      MAINTENANCE_CANDIDATE_REPORT_PATH: ${MAINTENANCE_CANDIDATE_REPORT_PATH:-}
    volumes:
      - ./jobs/spark:/opt/lakehouse/jobs:ro
      - ./src:/opt/lakehouse/src:ro
      - ./artifacts:/opt/lakehouse/artifacts
    command:
      [
        "/opt/spark/bin/spark-submit",
        "/opt/lakehouse/jobs/iceberg_maintenance.py",
      ]
    restart: "no"

  spark-snapshot-retention-check:
    image: lakehouse-ops/spark-iceberg:3.5.9-1.11.0
    profiles: ["compute"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      LAKEOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER:-lakeops-spark}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_MASTER: local[2]
      PYTHONPATH: /opt/lakehouse/jobs:/opt/lakehouse/tests
      SNAPSHOT_EXPIRATION_REPORT_PATH: /opt/lakehouse/artifacts/snapshot-expiration-report.json
    volumes:
      - ./jobs/spark:/opt/lakehouse/jobs:ro
      - ./tests/integration/check_retained_snapshot.py:/opt/lakehouse/tests/check_retained_snapshot.py:ro
      - ./artifacts:/opt/lakehouse/artifacts:ro
    command:
      [
        "/opt/spark/bin/spark-submit",
        "/opt/lakehouse/tests/check_retained_snapshot.py",
      ]
    restart: "no"

  spark-snapshot-rollback-drill:
    image: lakehouse-ops/spark-iceberg:3.5.9-1.11.0
    profiles: ["compute"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      LAKEOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER:-lakeops-spark}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_MASTER: local[2]
      PYTHONPATH: /opt/lakehouse/jobs
      SNAPSHOT_ROLLBACK_REPORT_PATH: /opt/lakehouse/artifacts/snapshot-rollback-report.json
    volumes:
      - ./jobs/spark:/opt/lakehouse/jobs:ro
      - ./tests/integration/exercise_snapshot_rollback.py:/opt/lakehouse/tests/exercise_snapshot_rollback.py:ro
      - ./artifacts:/opt/lakehouse/artifacts
    command:
      [
        "/opt/spark/bin/spark-submit",
        "/opt/lakehouse/tests/exercise_snapshot_rollback.py",
      ]
    restart: "no"

  spark-schema-evolution-drill:
    image: lakehouse-ops/spark-iceberg:3.5.9-1.11.0
    profiles: ["compute"]
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      LAKEOPS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_SPARK_USER:-lakeops-spark}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SPARK_PASSWORD:-spark-development-only}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_MASTER: local[2]
      PYTHONPATH: /opt/lakehouse/jobs
      SCHEMA_EVOLUTION_REPORT_PATH: /opt/lakehouse/artifacts/schema-evolution-report.json
    volumes:
      - ./jobs/spark:/opt/lakehouse/jobs:ro
      - ./tests/integration/exercise_schema_evolution.py:/opt/lakehouse/tests/exercise_schema_evolution.py:ro
      - ./artifacts:/opt/lakehouse/artifacts
    command:
      [
        "/opt/spark/bin/spark-submit",
