[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-ops-platform"
version = "0.24.0"
description = "A production-like control plane and reference platform for operating an Apache Iceberg lakehouse."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "WhySatanic" }]
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
]

[project.scripts]
lakeops = "lakehouse_ops.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_ops"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=lakehouse_ops --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
